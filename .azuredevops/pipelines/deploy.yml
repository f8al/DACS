# Gate 7. Only rules at lifecycle stage production ship. Tagged, reversible,
# and gated behind environments with approvals so a merge alone cannot page
# the SOC. Add an Approvals check to siem-staging and siem-production in
# Pipelines, Environments before the first tag: Azure DevOps creates a missing
# environment on first use with no checks.
#
# Each stage reads its own variable group, so the staging stage never sees the
# production token:
#   siem-staging      SIEM_URL, SIEM_TOKEN (secret)
#   siem-production   SIEM_URL, SIEM_TOKEN (secret), SOC_WEBHOOK (secret)
# Either group can be linked to a Key Vault.
#
# This file is read from the tagged commit, so whoever can push a v* tag can
# rewrite it, drop the environments and read the groups. The gates that hold
# are the ones this file cannot remove: restrict Create tag on refs/tags/v* to
# the release owners, and put an Approvals check on both variable groups.
trigger:
  branches:
    include: [refs/tags/v*]
pr: none

stages:
  - stage: staging
    variables:
      - group: siem-staging
    jobs:
      - deployment: staging
        environment: siem-staging
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none
                - template: templates/tag-on-main.yml
                - template: templates/python.yml
                - script: python tools/deploy.py --target staging --stage production --stage in_test
                  displayName: Compile and push to staging
                  env:
                    SIEM_URL: $(SIEM_URL)
                    SIEM_TOKEN: $(SIEM_TOKEN)

  - stage: production
    dependsOn: staging
    variables:
      - group: siem-production
    jobs:
      - deployment: production
        environment: siem-production
        pool:
          vmImage: ubuntu-latest
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none
                - template: templates/tag-on-main.yml
                - template: templates/python.yml
                - script: python tools/deploy.py --target production --stage production
                  displayName: Compile and push production stage rules only
                  env:
                    SIEM_URL: $(SIEM_URL)
                    SIEM_TOKEN: $(SIEM_TOKEN)
                - script: python tools/notify.py --release "$RELEASE"
                  displayName: Notify the SOC
                  env:
                    RELEASE: $(Build.SourceBranchName)
                    SOC_WEBHOOK: $(SOC_WEBHOOK)
