# Gate 5. The part most programs skip. Runs against a real lab or a ringfenced
# segment of production, on a self hosted agent that lives where the telemetry
# is collected. Never on a Microsoft hosted agent, because a hosted agent is
# not inside your monitored network.
#
# Two switches, both off by default, because this pipeline generates real
# traffic to live command and control infrastructure:
#   1. The pipeline does not exist until someone registers it, either with
#      tools/ado_setup.py --with-detonation or by hand. Do that only after the
#      detonation-lab agent pool is inside the monitored network and the
#      detonation-lab environment has an Approvals check. Azure DevOps creates
#      a missing environment on first use with no checks, so the environment
#      alone is not a gate until someone configures it.
#   2. The stage is skipped unless the pipeline variable DETONATION_ENABLED is
#      true. Set it in the pipeline's Variables, not in this file, which would
#      override it.
#
# The variable group detonation-lab holds SPLUNK_URL, SPLUNK_TOKEN (secret),
# THEHIVE_URL, THEHIVE_API_KEY (secret), DETONATION_HOST, DETONATION_USER and
# DETONATION_HOST_ADDRESSES, plus SPLUNK_CA_CERT and THEHIVE_CA_CERT if the
# lab uses a private CA. DETONATION_HOST_ADDRESSES lists every address the
# detonation host's traffic can carry in an alert (its IPs, NAT address,
# hostname), comma-separated: network scenarios bind alerts to the host
# through it, because flightsim traffic cannot carry the Threatest UUID.
# These live in the group, not in pipeline variables, which reach a run of
# any branch. Give the group and the detonation-lab agent pool a Branch
# control check allowing only refs/heads/main: a queued run of another branch
# could otherwise rewrite this file and take the keys and the lab agent.
#
# The agent needs git, curl and Python 3 with PyYAML on PATH, and SSH access
# to DETONATION_HOST, which runs flightsim and any Atomic tests. Threatest is
# not taken from PATH: the job installs the f8al/threatest fork build pinned
# below, which adds the Splunk and TheHive matchers. Upstream DataDog/threatest
# cannot parse those scenario keys.
trigger: none
pr: none

schedules:
  - cron: "0 7 * * 1-5"   # 07:00 UTC on weekdays
    displayName: Weekday detonation
    branches:
      include: [main]
    always: true          # detonation tests telemetry, which changes without commits

parameters:
  - name: scenario
    displayName: Scenario file to run, or all for every file with active scenarios
    type: string
    default: all

variables:
  stampBranch: automation/stamp-last-validated
  # Pinned Threatest fork release. To upgrade, change both values together,
  # taking the hash from the release's checksums.txt. Never use latest: this
  # binary runs on the lab agent next to the detonation secrets.
  threatestVersion: v1.5.0-dacs.2
  threatestSha256: 6cb8ef3d400d5be08ca9219881c34dbb7787ddd002ea5fed2c843574ede1c4bb

stages:
  - stage: network_detonation
    displayName: network-detonation
    condition: eq(variables['DETONATION_ENABLED'], 'true')
    variables:
      - group: detonation-lab
    jobs:
      - deployment: network_detonation
        displayName: network-detonation
        environment: detonation-lab
        pool: detonation-lab
        timeoutInMinutes: 60
        strategy:
          runOnce:
            deploy:
              steps:
                - download: none
                # Credentials persist so the stamp step can push its branch.
                - checkout: self
                  persistCredentials: true
                  clean: true

                # Downloads the pinned fork build and refuses to run it unless
                # the archive matches the pinned hash. Installed under the
                # agent's temp directory, which is cleared after every job, so
                # nothing left on the self hosted agent can shadow it.
                - script: |
                    set -euo pipefail
                    dir="$AGENT_TEMPDIRECTORY/threatest-$THREATEST_VERSION"
                    mkdir -p "$dir"
                    curl -fsSL --proto '=https' --tlsv1.2 --retry 3 \
                      -o "$dir/threatest.tar.gz" \
                      "https://github.com/f8al/threatest/releases/download/$THREATEST_VERSION/threatest_Linux_x86_64.tar.gz"
                    echo "$THREATEST_SHA256  $dir/threatest.tar.gz" | sha256sum --check --strict -
                    tar -xzf "$dir/threatest.tar.gz" -C "$dir" threatest
                    "$dir/threatest" --help >/dev/null
                    echo "##vso[task.prependpath]$dir"
                  displayName: Install pinned Threatest fork build
                  env:
                    THREATEST_VERSION: $(threatestVersion)
                    THREATEST_SHA256: $(threatestSha256)

                # Threatest detonates each remoteDetonator scenario on
                # DETONATION_HOST over SSH, which is where flightsim and Atomic
                # tests run. Neither is ever run on the agent itself: a second
                # detonation from another address in the same window would
                # muddy the host and time binding the assertions rely on.
                # Stratus scenarios are the exception, they call the cloud API
                # from the agent, see scenarios/cloud.threatest.yaml.
                #
                # SSH: Threatest and the flightsim step both connect through
                # the agent user's ~/.ssh/config entry for DETONATION_HOST.
                # Threatest reads the key from its IdentityFile, which must be
                # unencrypted because Threatest does not use ssh-agent, and
                # both refuse a host whose key is not in ~/.ssh/known_hosts.
                # Setup is in docs/lab-setup.md.
                #
                # One results file per scenario file. A file that fails lint or
                # a scenario that fails does not stop the other files from
                # running. build/ is removed first because a self hosted agent
                # keeps its workspace, and last night's results must never be
                # stamped again.
                #
                # A variable missing from the group arrives as the literal text
                # $(NAME), not as empty. Unchecked, a missing
                # DETONATION_HOST_ADDRESSES makes every network assertion fail
                # as a missing alert and files a tuning work item for a rule
                # that is fine, so stop before detonating and name the variable.
                # Only names are printed, never values.
                - script: |
                    missing=0
                    # Pairs of environment variable and the group variable
                    # that feeds it, so the error names what to add.
                    for pair in SPLUNK_URL:SPLUNK_URL SPLUNK_TOKEN:SPLUNK_TOKEN \
                        THEHIVE_URL:THEHIVE_URL THEHIVE_API_KEY:THEHIVE_API_KEY \
                        THREATEST_SSH_HOST:DETONATION_HOST \
                        THREATEST_SSH_USERNAME:DETONATION_USER \
                        THEHIVE_DETONATION_HOSTS:DETONATION_HOST_ADDRESSES; do
                      name=${pair%%:*}
                      value=${!name-}
                      case "$value" in
                        ''|'$('*)
                          echo "##vso[task.logissue type=error]${pair#*:} is not set in the detonation-lab variable group"
                          missing=1
                          ;;
                      esac
                    done
                    [ "$missing" = 0 ] || exit 1

                    rm -rf build
                    mkdir -p build/threatest
                    if [ "$SCENARIO" = all ]; then
                      files=$(python3 tools/scenarios.py active) || exit 1
                    else
                      files=$SCENARIO
                    fi
                    status=0
                    for f in $files; do
                      echo "##[group]$f"
                      threatest lint "$f" && threatest run "$f" \
                        --output "build/threatest/$(basename "$f" .threatest.yaml).json" \
                        --parallelism 3 || status=1
                      echo "##[endgroup]"
                    done
                    exit $status
                  displayName: Detonate and assert via Threatest
                  # Everything below reaches the script only through the
                  # environment, never interpolated into the script body: a run
                  # parameter cannot inject shell, and the secrets are masked
                  # and never echoed.
                  env:
                    SCENARIO: ${{ parameters.scenario }}
                    SPLUNK_URL: $(SPLUNK_URL)
                    SPLUNK_TOKEN: $(SPLUNK_TOKEN)
                    THEHIVE_URL: $(THEHIVE_URL)
                    THEHIVE_API_KEY: $(THEHIVE_API_KEY)
                    # Uncomment for a private CA, with the CA file paths on the
                    # agent in the variable group. Left commented because an
                    # undefined variable arrives as the literal text $(NAME),
                    # not as empty. Never set the *_INSECURE_SKIP_VERIFY
                    # variables.
                    #   SPLUNK_CA_CERT: $(SPLUNK_CA_CERT)
                    #   THEHIVE_CA_CERT: $(THEHIVE_CA_CERT)
                    THREATEST_SSH_HOST: $(DETONATION_HOST)
                    THREATEST_SSH_USERNAME: $(DETONATION_USER)
                    THEHIVE_DETONATION_HOSTS: $(DETONATION_HOST_ADDRESSES)

                # Rules validated by flightsim alone, without a Threatest
                # scenario. Runs after Threatest has finished so the two never
                # overlap on the host, and whether or not Threatest passed.
                # Proves telemetry, not the alert, so nothing here is stamped.
                # Skipped when a single scenario file was requested.
                - script: python3 tools/detonate_flightsim.py
                  displayName: Detonate rules validated by flightsim alone
                  condition: and(not(canceled()), eq('${{ parameters.scenario }}', 'all'))
                  env:
                    DETONATION_HOST: $(DETONATION_HOST)
                    DETONATION_USER: $(DETONATION_USER)

                - publish: build
                  artifact: detonation-results
                  condition: succeededOrFailed()

                # Runs whether or not every scenario passed: one failing
                # scenario must not stop the others from being stamped.
                # stamp_validation.py stamps passes only.
                - script: |
                    if ! ls build/threatest/*.json >/dev/null 2>&1; then
                      echo "no Threatest results, nothing to stamp"
                      exit 0
                    fi
                    python3 tools/stamp_validation.py build/threatest/*.json || exit 1
                    if git diff --quiet -- detections/; then
                      echo "##vso[task.setvariable variable=stampChanged]false"
                    else
                      echo "##vso[task.setvariable variable=stampChanged]true"
                    fi
                  displayName: Stamp last_validated on rules that passed
                  condition: succeededOrFailed()

                # main is protected, so the stamp lands through a pull request.
                # One standing branch, rebuilt from main each run, so unmerged
                # stamps collapse into a single pull request instead of one per
                # night. Stamps from an earlier unmerged run are replaced by
                # tonight's. Unlike GitHub, a pull request the build service
                # opens does trigger the validate build policy.
                #
                # Grant "<project> Build Service (<org>)" on this repository:
                # Contribute, Create branch, Contribute to pull requests, and
                # Force push on the stamp branch.
                - script: |
                    git config user.name "Detection pipeline"
                    git config user.email "detection-pipeline@noreply.invalid"
                    git checkout -B "$BRANCH"
                    git add detections/
                    git commit -m "Stamp last_validated from detonation run $(Build.BuildId)"
                    git push --force origin "HEAD:refs/heads/$BRANCH"
                  displayName: Push the stamp branch
                  condition: and(succeededOrFailed(), eq(variables.stampChanged, 'true'))
                  env:
                    BRANCH: $(stampBranch)

                - script: python3 tools/ado.py stamp-pr --branch "$BRANCH"
                  displayName: Create the stamp pull request if none is open
                  condition: and(succeededOrFailed(), eq(variables.stampChanged, 'true'))
                  env:
                    BRANCH: $(stampBranch)
                    SYSTEM_ACCESSTOKEN: $(System.AccessToken)

                # One open work item per failing scenario or flightsim rule.
                # One that keeps failing gets a comment per run on its existing
                # work item, not a new one every night. Needs Edit work items in
                # this node on the area path for the build service.
                - script: python3 tools/ado.py detonation-failures build/threatest/*.json build/flightsim-results.json
                  displayName: Open or update a tuning work item for every failed detonation
                  condition: failed()
                  env:
                    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
