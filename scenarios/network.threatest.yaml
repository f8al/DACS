# Threatest scenarios for network layer detections.
#
# Requires the f8al/threatest fork build pinned in detonate-nightly.yml, which
# adds the theHiveAlert and splunkLog matchers. Schema:
# https://github.com/f8al/threatest/blob/v1.5.0-dacs.2/schemas/threatest.schema.json
#
# Correlation caveat: flightsim does not emit a Threatest correlation UUID. The
# remote detonator only puts it in the parent process name, which DNS and
# network telemetry never carry. These assertions use correlation: host, which
# binds on alert title, alerts created after the run started, and an
# observable equal to one of the detonation host's addresses
# (THEHIVE_DETONATION_HOSTS). Run them from a dedicated detonation host whose
# addresses are not shared with anything else that could trip the same rule.
#
# observableField names the Splunk field the alert action turns into the
# observable. It must be listed in TA-thehive-cortex's thehive_datatypes.csv,
# e.g. "src_ip,observable,ip,". Without it the field never becomes an
# observable and the assertion cannot match.
#
# Threatest takes the scenario timeout from the first expectation. It must
# cover the saved search schedule, the rule's correlation timespan, ingest lag,
# the alert action and TheHive ingestion.
scenarios:
  - name: DNS tunneling detected from egress host
    detonate:
      remoteDetonator:
        commands:
          - "flightsim run tunnel-dns -fast"
    expectations:
      - timeout: 30m
        theHiveAlert:
          title: "DNS Tunneling via High Volume Unique Subdomains"
          source: splunk
          correlation: host
          observableField: src_ip

