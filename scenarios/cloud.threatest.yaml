# Threatest scenarios for cloud control plane detections, detonated with
# Stratus Red Team.
#
# Unlike the remoteDetonator, Stratus runs on the runner itself and calls the
# cloud provider's API with whatever credentials are in the runner's
# environment. Point it at a dedicated sandbox account, never one that holds
# production workloads, and give the runner a role scoped to that account.
# The detonation-host address rule in docs/testing-strategy.md does not apply,
# because the evidence is in the provider's audit log, not on the network.
#
# Stratus creates and destroys the prerequisite infrastructure for some
# techniques. Read the technique's page for what it creates and what it costs
# before enabling it.
#
# Every active scenario must assert a rule that exists in detections/; the
# validator fails the build otherwise. Uncomment each one when its rule lands.
scenarios:
