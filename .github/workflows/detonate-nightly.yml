name: detonate-nightly

# Gate 5. The part most programs skip. Runs against a real lab or a ringfenced
# segment of production, on a self hosted runner that lives where the telemetry
# is collected. Never on a hosted GitHub runner, because a hosted runner is not
# inside your monitored network.
#
# Off until a repository opts in by setting the variable DETONATION_ENABLED to
# true. Every repository created from this scaffold inherits the schedule, and
# this job generates real traffic to live command and control infrastructure.
# Opt in only after the runner is inside the monitored network and the
# detonation-lab environment has required reviewers. GitHub creates a missing
# environment on first use with no protection rules, so the environment alone
# is not a gate until someone configures it.
on:
  schedule:
    - cron: "0 7 * * 1-5"   # 07:00 UTC on weekdays
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario file to run, blank for every file with active scenarios
        default: ""

permissions:
  contents: write        # push the stamp branch
  pull-requests: write   # open the stamp pull request
  issues: write          # file tuning issues for failed assertions

jobs:
  network-detonation:
    if: vars.DETONATION_ENABLED == 'true'
    runs-on: [self-hosted, detonation-lab]
    environment: detonation-lab          # add required reviewers in repo settings before opting in
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # See the stamp step: a pull request opened with GITHUB_TOKEN does not
          # trigger the validate workflow, so its required checks never report.
          token: ${{ secrets.STAMP_PR_TOKEN || github.token }}

      # Threatest detonates each remoteDetonator scenario on DETONATION_HOST
      # over SSH, which is where flightsim and Atomic tests run. Neither is ever
      # run on the runner itself: a second detonation from another address in
      # the same window would muddy the host and time binding the assertions
      # rely on. Stratus scenarios are the exception, they call the cloud API
      # from the runner, see scenarios/cloud.threatest.yaml. SSH authenticates
      # with the runner's agent or default key; add --ssh-keyfile to both
      # commands to use a specific one.
      #
      # One results file per scenario file. A file that fails lint or a
      # scenario that fails does not stop the other files from running.
      - name: Detonate and assert via Threatest
        run: |
          mkdir -p build/threatest
          files="${SCENARIO:-$(python tools/scenarios.py active)}"
          status=0
          for f in $files; do
            echo "::group::$f"
            threatest lint "$f" && threatest run "$f" \
              --output "build/threatest/$(basename "$f" .threatest.yaml).json" \
              --parallelism 3 || status=1
            echo "::endgroup::"
          done
          exit $status
        env:
          # Passed through the environment, not interpolated into the script,
          # so a dispatch input cannot inject shell.
          SCENARIO: ${{ inputs.scenario }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
          THREATEST_SSH_HOST: ${{ vars.DETONATION_HOST }}
          THREATEST_SSH_USERNAME: ${{ vars.DETONATION_USER }}

      # Rules validated by flightsim alone, without a Threatest scenario. Runs
      # after Threatest has finished so the two never overlap on the host, and
      # whether or not Threatest passed. Proves telemetry, not the alert, so
      # nothing here is stamped. Skipped when one scenario file was dispatched.
      - name: Detonate rules validated by flightsim alone
        if: ${{ !cancelled() && !inputs.scenario }}
        run: python tools/detonate_flightsim.py
        env:
          DETONATION_HOST: ${{ vars.DETONATION_HOST }}
          DETONATION_USER: ${{ vars.DETONATION_USER }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detonation-results
          path: |
            build/threatest/
            build/flightsim-results.json
          if-no-files-found: ignore

      # Runs whether or not every scenario passed: one failing scenario must not
      # stop the others from being stamped. stamp_validation.py stamps passes only.
      - name: Stamp last_validated on rules that passed
        id: stamp
        if: always() && hashFiles('build/threatest/*.json') != ''
        run: |
          python tools/stamp_validation.py build/threatest/*.json
          if git diff --quiet -- detections/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # main is protected, so the stamp lands through a pull request. One
      # standing branch, rebuilt from main each run, so unmerged stamps collapse
      # into a single pull request instead of one per night. Stamps from an
      # earlier unmerged run are replaced by tonight's.
      #
      # Set a STAMP_PR_TOKEN secret (GitHub App or fine grained token with
      # contents and pull requests write) so validate runs on the pull request.
      # Without it the pull request opens but its required checks never report.
      # Also enable Settings > Actions > "Allow GitHub Actions to create and
      # approve pull requests".
      - name: Open or update the stamp pull request
        if: always() && steps.stamp.outputs.changed == 'true'
        env:
          BRANCH: automation/stamp-last-validated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add detections/
          git commit -m "Stamp last_validated from detonation run ${{ github.run_id }}"
          git push --force origin "$BRANCH"

      - name: Create the stamp pull request if none is open
        if: always() && steps.stamp.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.STAMP_PR_TOKEN || github.token }}
          script: |
            const head = 'automation/stamp-last-validated';
            const { owner, repo } = context.repo;
            const open = await github.rest.pulls.list({ owner, repo, head: `${owner}:${head}`, state: 'open' });
            if (open.data.length) {
              core.info(`stamp pull request already open: ${open.data[0].html_url}`);
              return;
            }
            const { data: pr } = await github.rest.pulls.create({
              owner, repo, head,
              base: context.payload.repository.default_branch,
              title: 'Stamp last_validated from nightly detonation',
              body: [
                'Rules whose Threatest scenario passed in the nightly detonation run.',
                '',
                `Run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
                '',
                'This branch is rebuilt from the default branch on every run with changes.',
                'Merge it to record validation; the coverage metrics read last_validated from main.',
              ].join('\n'),
            });
            core.info(`opened ${pr.html_url}`);

      # One open issue per failing scenario or flightsim rule. One that keeps
      # failing gets a comment per run on its existing issue, not a new issue
      # every night.
      - name: Open or update a tuning issue for every failed detonation
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const files = [
              ...(fs.existsSync('build/threatest') ? fs.readdirSync('build/threatest').map(f => `build/threatest/${f}`) : []),
              'build/flightsim-results.json',
            ];
            let results = [];
            for (const f of files) {
              try { results.push(...JSON.parse(fs.readFileSync(f, 'utf8'))); } catch (e) {}
            }
            const failed = results.filter(x => !x.isSuccess);
            if (!failed.length) return;

            const open = new Map(
              (await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open' }))
                .filter(i => !i.pull_request)
                .map(i => [i.title, i.number])
            );
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            for (const r of failed) {
              const title = `[tuning] detonation failed: ${r.description}`;
              const detail = [
                '```', (r.errorMessage || 'no error message').slice(0, 4000), '```',
                '',
                `Detonated at ${r.timeDetonated}, ran for ${r.durationSeconds}s.`,
                `Run: ${run}`,
              ];
              if (open.has(title)) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: open.get(title),
                  body: ['Failed again.', '', ...detail].join('\n'),
                });
                continue;
              }
              const { data: issue } = await github.rest.issues.create({
                owner, repo, title,
                labels: ['tuning','detonation-failure'],
                body: (r.description.startsWith('flightsim: ') ? [
                  `**${r.description}** did not complete on the detonation host.`,
                  '',
                  ...detail,
                  '',
                  'flightsim alone does not check the alert, so this is a detonation problem:',
                  'the host is unreachable, flightsim failed, or the command was refused as unsafe.',
                ] : [
                  `Scenario **${r.description}** did not produce the expected signal.`,
                  '',
                  ...detail,
                  '',
                  'A failure here means one of: the rule broke, the data source stopped flowing,',
                  'the detonation was blocked by a control, or the timeout is too short.',
                  'Distinguish blocked from undetected before tuning the rule.'
                ]).join('\n')
              });
              open.set(title, issue.number);
            }
